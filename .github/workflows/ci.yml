name: FLICKER CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --workspace
      - name: Test workspace
        run: cargo test --workspace
      - name: Build flicker-plan (release)
        run: cargo build -p flicker-plan --release

  python-worker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build flicker-plan
        run: cargo build -p flicker-plan --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run worker selftest
        working-directory: ./worker
        env:
          PYTHONPATH: .
        run: python3 -m flicker_worker selftest
